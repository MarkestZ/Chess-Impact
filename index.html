<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Impact – หมากรุกสากล</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1420;--panel:#18212f;--ink:#e9eef7;--mute:#8a97ad;--lt:linear-gradient(135deg,#f3e6bd,#dcc58a);--dk:linear-gradient(135deg,#6a4226,#3b2112);--gold:#f4b942;--red:#ff4d5e;--s:min(94vw,calc(100vh - 250px),700px);--b:calc(var(--s)*.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 30%,#1b2740,var(--bg) 70%) fixed;background-color:var(--bg);color:var(--ink);font-family:'Prompt',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 18px;overflow-x:hidden}
header{width:var(--s);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(18px,4.5vw,26px);font-weight:800;letter-spacing:.5px}
#turn{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px}
#turn i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #555;transition:.3s}
#turn.b i{background:#150f26;border-color:#b69cff}
#turn.c{color:var(--red)}
.tray{width:var(--s);min-height:30px;font-size:22px;line-height:30px;color:var(--mute);display:flex;flex-wrap:wrap;gap:0 1px}
.tray .w{color:#fff6dc;-webkit-text-stroke:1px #dcaa3c;paint-order:stroke fill}
.tray .b{color:#1a1208;-webkit-text-stroke:1px #e8b94a;paint-order:stroke fill}
#wrap{position:relative}
#wrap{filter:drop-shadow(0 22px 34px #000b)}
#frame{width:var(--s);height:var(--s);padding:1.1%;background:linear-gradient(135deg,#f6d77e,#b8862b 45%,#f0c75e 60%,#8a5f17);clip-path:polygon(13% 0,87% 0,100% 13%,100% 87%,87% 100%,13% 100%,0 87%,0 13%)}
#in{position:relative;width:100%;height:100%;display:grid;place-items:center;clip-path:polygon(13% 0,87% 0,100% 13%,100% 87%,87% 100%,13% 100%,0 87%,0 13%);background:repeating-linear-gradient(45deg,#e3b24a22 0 2px,#0000 2px 16px),repeating-linear-gradient(-45deg,#e3b24a22 0 2px,#0000 2px 16px),linear-gradient(135deg,#6b3d1f,#3a1e0e 40%,#5a3118 62%,#2a1409)}
#studs{position:absolute;inset:0;pointer-events:none}
#board{position:relative;width:var(--b);height:var(--b);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);overflow:hidden;box-shadow:0 0 0 3px #c9962b,0 0 0 7px #24120a,0 0 0 9px #e8b94a,0 6px 18px 9px #0008}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)/8*.78);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq u,.sq s{position:absolute;font-size:calc(var(--s)/60 + 6px);text-decoration:none;font-weight:600;opacity:.7;pointer-events:none}
.sq u{top:2px;left:3px}.sq s{bottom:1px;right:3px}
.sq.l u,.sq.l s{color:#7a4f2a}.sq.d u,.sq.d s{color:#e8b94a}
.sq.last::before{content:"";position:absolute;inset:0;background:#f4b94266}
.sq.sel::before{content:"";position:absolute;inset:0;background:#f4b942aa}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#e8b94acc;box-shadow:0 0 0 2px #24120a99}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid #ff4d5eaa}
.sq.chk{background:radial-gradient(circle,#ff4d5e 0,#ff4d5e55 60%,transparent 75%),var(--lt);animation:pulse .8s infinite alternate}
.sq.chk.d{background:radial-gradient(circle,#ff4d5e 0,#ff4d5e55 60%,transparent 75%),var(--dk)}
@keyframes pulse{to{filter:brightness(1.4)}}
.p{position:relative;z-index:2;line-height:1;transition:transform .2s}
.p.w{color:#fff6dc;-webkit-text-stroke:2px #dcaa3c;paint-order:stroke fill;text-shadow:0 2px 4px #000a,0 0 8px #f4b94255}
.p.b{color:#1a1208;-webkit-text-stroke:2px #e8b94a;paint-order:stroke fill;text-shadow:0 2px 4px #000a,0 0 8px #f4b94266}
.sq:hover .p{transform:translateY(-2px) scale(1.06)}
.dead .p{transform:rotate(80deg) translateY(25%)!important;filter:grayscale(1) brightness(.6);transition:transform 1s}
.btns{display:flex;gap:8px}
button{font:600 14px 'Prompt',sans-serif;color:var(--ink);background:var(--panel);border:1px solid #2f3d58;padding:8px 16px;border-radius:10px;cursor:pointer}
select{font:600 14px 'Prompt',sans-serif;color:var(--ink);background:var(--panel);border:1px solid #2f3d58;padding:8px 10px;border-radius:10px;cursor:pointer}
[hidden]{display:none!important}
#menu{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;background:radial-gradient(ellipse at 50% 25%,#22345a,#0a0f1a 75%);text-align:center;overflow:hidden}
#menu.on{display:flex}
#menu .bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#menu .bg span{position:absolute;bottom:-12vh;font-size:clamp(40px,9vw,90px);opacity:.1;animation:fl2 14s linear infinite}
@keyframes fl2{to{transform:translateY(-120vh) rotate(25deg)}}
#menu h1{font-size:clamp(38px,10vw,78px);letter-spacing:2px;background:linear-gradient(#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #f4b94266)}
#menu p{margin:0;color:var(--mute);font-size:16px}
#menu .v{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
#menu .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:min(300px,86vw);padding:22px 18px;border-radius:18px;background:#18212fdd;border:2px solid #2f3d58;display:flex;flex-direction:column;gap:6px;align-items:center;transition:.2s}
.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-4px);background:#223048;box-shadow:0 12px 40px #f4b94233}
.card em{font-style:normal;font-size:54px;line-height:1}
.card b{font-size:22px;font-weight:800}
.card small{font-size:14px;color:var(--mute);font-weight:400}
.card.sm{padding:16px 14px;width:min(200px,86vw)}.card.sm em{font-size:34px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline}
#dice{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;background:radial-gradient(ellipse at 50% 25%,#22345a,#0a0f1a 75%);text-align:center}
#dice.on{display:flex}
#dice h2{margin:0;font-size:clamp(28px,7vw,48px);font-weight:800}
#dmsg{margin:0;min-height:56px;font-size:17px;line-height:1.6}
#dice .row{display:flex;gap:24px;justify-content:center}
.pl{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;border:2px solid #2f3d58;background:#18212fdd;transition:.3s;font-weight:600}
.pl.win{border-color:var(--gold);box-shadow:0 0 40px #f4b94266;transform:scale(1.07)}
.die{width:min(30vw,112px);aspect-ratio:1;border-radius:20%;background:#fff8e6;box-shadow:0 6px 0 #c9b88f,0 12px 24px #0008;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;gap:4%}
.die i{border-radius:50%}.die i.on{background:#1a1030;box-shadow:inset 0 2px 3px #000a}
.die.roll{animation:tumble .35s linear infinite}
@keyframes tumble{25%{transform:translateY(-14px) rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:translateY(-8px) rotate(270deg)}to{transform:rotate(360deg)}}
.go{background:var(--gold);color:#2a1a00;border:0;font-size:20px;padding:12px 34px;border-radius:14px}
.go:hover{background:#ffcf6b}
#res{position:fixed;inset:0;z-index:75;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:radial-gradient(circle,#0b1224d9,#050810f5);text-align:center;cursor:pointer;overflow:hidden}
#res.on{display:flex;animation:fin .4s}
@keyframes fin{from{opacity:0}}
#res::before{content:"";position:absolute;left:50%;top:42%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(#f4b94230 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:spinr 24s linear infinite}
@keyframes spinr{to{transform:translate(-50%,-50%) rotate(360deg)}}
#res>*{position:relative}
#rsc{display:flex;align-items:center;gap:.22em;font-size:clamp(70px,24vw,190px);font-weight:800;line-height:1;animation:slam .8s cubic-bezier(.2,1.6,.4,1) both}
#rsc .w{color:#fff;text-shadow:0 0 30px var(--gold),0 0 80px var(--gold),0 6px 0 #8a5a00}
#rsc .l{color:#53627f;font-size:.7em}#rsc .c{color:var(--mute);font-size:.55em}
@keyframes slam{from{transform:scale(4.5);opacity:0;filter:blur(16px)}to{transform:none;opacity:1;filter:none}}
#rwho{margin:0;font-size:clamp(28px,8vw,60px);font-weight:800;background:linear-gradient(#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #f4b94299);animation:slam .8s .35s cubic-bezier(.2,1.6,.4,1) both}
#rsub{margin:0;font-size:clamp(16px,4vw,24px);animation:fin 1s .9s both}
#res .tap{margin-top:18px;padding:13px 36px;border-radius:99px;background:var(--gold);color:#2a1a00;font-weight:800;font-size:clamp(18px,4.5vw,24px);animation:fin .5s 1.1s both,beat .8s 1.6s ease-in-out infinite alternate}
@keyframes beat{to{transform:scale(1.09);box-shadow:0 0 50px #f4b942bb}}
.turn{position:fixed;left:0;right:0;top:40%;z-index:53;pointer-events:none;text-align:center;padding:14px 0;display:flex;flex-direction:column;align-items:center;animation:trn 1.3s ease-out both;background:linear-gradient(90deg,transparent,#060a14d0 25%,#060a14d0 75%,transparent);border-top:2px solid #f4b94288;border-bottom:2px solid #f4b94288}
.turn b{font-size:clamp(30px,9vw,72px);font-weight:800;-webkit-text-stroke:3px var(--gold);paint-order:stroke fill;text-shadow:0 0 22px #f4b942aa;letter-spacing:1px}
.turn.w b{color:#fff}.turn.b b{color:#14101f}
.turn i{font-style:normal;font-size:clamp(14px,3.5vw,20px);color:var(--gold);font-weight:600}
@keyframes trn{0%{transform:translateX(-70vw) scaleY(.6);opacity:0}16%{transform:none;opacity:1}80%{transform:none;opacity:1}100%{transform:translateX(70vw) scaleY(.6);opacity:0}}
.shard{position:fixed;z-index:56;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1}
#rcrown{font-size:clamp(64px,17vw,130px);line-height:1;animation:slam .8s .1s cubic-bezier(.2,1.6,.4,1) both}
#rcrown span{display:inline-block;animation:bob 1.1s ease-in-out infinite alternate}
#rcrown .w{color:#fff8e6;text-shadow:0 0 26px #f4b942,0 0 6px #f4b942,0 0 3px #f4b942}
#rcrown .b{color:#14101f;text-shadow:0 0 26px #f4b942,0 0 4px #f4b942,0 0 4px #f4b942,0 0 3px #f4b942}
@keyframes bob{to{transform:translateY(-14px) rotate(7deg) scale(1.1)}}
.rlinks{display:flex;gap:22px;margin-top:6px;animation:fin 1s 1.6s both}

.logo{position:relative;width:clamp(250px,min(74vw,72vh*1.2),560px);aspect-ratio:1.45;animation:lshake 2.4s linear infinite}
#pcs{display:contents}
.logo .aura{position:absolute;inset:-25% -15%;pointer-events:none;background:radial-gradient(circle at 30% 50%,#fff2c877,transparent 38%),radial-gradient(circle at 70% 50%,#ff3d3d77,transparent 38%);animation:laura 2.4s ease-in-out infinite}
.logo .rays{position:absolute;left:50%;top:44%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;background:repeating-conic-gradient(#ffd36b40 0 5deg,#0000 5deg 14deg);-webkit-mask:radial-gradient(circle,#000 0,#0000 52%);mask:radial-gradient(circle,#000 0,#0000 52%);animation:lrayrot 9s linear infinite,lraypulse 2.4s ease-in-out infinite}
.logo .floor{position:absolute;left:0;right:0;bottom:1%;height:10%;border-radius:50%;background:radial-gradient(ellipse,#000b 0,#0000 70%)}
.pc{position:absolute;bottom:7%;height:86%;transform-origin:50% 100%;animation:lcharge 2.4s infinite;will-change:transform}
.pc.k{left:-2%;width:38.1%;--wu:-16%;--hit:30%;--rc:-22%;--s:1;--gl:#ffe28a}
.pc.r{right:5.7%;width:30.3%;--wu:20%;--hit:-37%;--rc:28%;--s:-1;--gl:#ff4d5e}
.pc .spr{width:100%;height:100%;background:center bottom/contain no-repeat}
.pc.k .spr{background-image:var(--kimg)}.pc.r .spr{background-image:var(--rimg)}
.pc.m .spr{animation:lvib .08s linear infinite}
.pc.g1{animation-delay:.05s}.pc.g2{animation-delay:.1s}
.pc.g1 .spr{filter:blur(3px);--o:.45;animation:lgh 2.4s linear infinite}.pc.g2 .spr{filter:blur(6px);--o:.25;animation:lgh 2.4s linear infinite}
.logo .flash{position:absolute;left:50%;top:44%;width:40%;aspect-ratio:1;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,#fffffff2 0,#ffe28acc 20%,#ff7a3d66 44%,#0000 66%);animation:lflash 2.4s linear infinite}
.logo .star{position:absolute;left:50%;top:44%;width:90%;aspect-ratio:1;pointer-events:none;transform:translate(-50%,-50%) scale(0);opacity:0;background:repeating-conic-gradient(#fff 0 2.5deg,#0000 2.5deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,#0000 62%);mask:radial-gradient(circle,#000 0,#0000 62%);animation:lstar 2.4s linear infinite}
.logo .ring{position:absolute;left:50%;top:44%;width:26%;aspect-ratio:1;border-radius:50%;pointer-events:none;border:3px solid #ffe28a;box-shadow:0 0 18px #f4b942,inset 0 0 12px #f4b942;transform:translate(-50%,-50%) scale(0);opacity:0;animation:lring 2.4s ease-out infinite}
.logo .ring.b{border-color:#ff4d5e;box-shadow:0 0 18px #ff4d5e,inset 0 0 12px #ff4d5e;animation-delay:.07s}
@keyframes lcharge{
0%{transform:none;filter:drop-shadow(0 0 10px var(--gl)) brightness(1);animation-timing-function:ease-out}
8%{transform:none;filter:drop-shadow(0 0 10px var(--gl)) brightness(1);animation-timing-function:ease-out}
32%,38%{transform:translateX(var(--wu)) rotate(calc(-7deg*var(--s))) scale(.97);filter:drop-shadow(0 0 20px var(--gl)) brightness(1.15);animation-timing-function:cubic-bezier(.9,0,1,.5)}
42%{transform:translateX(var(--hit)) rotate(calc(6deg*var(--s))) scale(1.08);filter:drop-shadow(0 0 26px #ffd36b) brightness(1.25);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
56%{transform:translateX(var(--rc)) rotate(calc(-5deg*var(--s))) scale(1);filter:drop-shadow(0 0 22px var(--gl)) brightness(1.2);animation-timing-function:ease-in-out}
78%,100%{transform:none;filter:drop-shadow(0 0 10px var(--gl)) brightness(1)}}
@keyframes lvib{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,0)}75%{transform:translate(0,1px)}}
@keyframes lgh{0%,33%{opacity:0}38%,56%{opacity:var(--o)}66%,100%{opacity:0}}
@keyframes lshake{0%,41%,55%,100%{transform:none}42%{transform:translate(-7px,3px) rotate(-.8deg)}44%{transform:translate(8px,-4px) rotate(1deg)}46%{transform:translate(-6px,-3px)}48%{transform:translate(5px,4px)}51%{transform:translate(-3px,2px)}}
@keyframes laura{0%,100%{opacity:.5;transform:scale(.95)}42%{opacity:1;transform:scale(1.3)}62%{opacity:.6;transform:scale(1)}}
@keyframes lrayrot{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes lraypulse{0%,100%{opacity:.3}42%{opacity:1}62%{opacity:.4}}
@keyframes lflash{0%,40%{transform:translate(-50%,-50%) scale(0);opacity:0}42%{transform:translate(-50%,-50%) scale(1);opacity:1}60%{transform:translate(-50%,-50%) scale(2.1);opacity:0}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
@keyframes lstar{0%,40%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}42%{transform:translate(-50%,-50%) scale(.55) rotate(0);opacity:1}58%{transform:translate(-50%,-50%) scale(1.3) rotate(35deg);opacity:0}100%{opacity:0}}
@keyframes lring{0%,41%{transform:translate(-50%,-50%) scale(0);opacity:0}44%{opacity:1}70%{transform:translate(-50%,-50%) scale(5);opacity:0}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
.ticon{height:1.05em;width:1.05em;object-fit:contain;vertical-align:-.14em;margin-right:.3em;border-radius:22%}
@media (prefers-reduced-motion:reduce){.logo,.logo *{animation:none!important}}
button:hover{background:#243350}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.flash{position:fixed;inset:0;z-index:85;pointer-events:none;animation:fl .6s ease-out forwards}
@keyframes fl{from{opacity:var(--o,.4)}to{opacity:0}}
.shake{animation:sh .6s}
@keyframes sh{10%{transform:translate(calc(var(--i)*-9px),calc(var(--i)*5px)) rotate(calc(var(--i)*-.5deg))}30%{transform:translate(calc(var(--i)*8px),calc(var(--i)*-6px)) rotate(calc(var(--i)*.5deg))}50%{transform:translate(calc(var(--i)*-6px),calc(var(--i)*4px))}70%{transform:translate(calc(var(--i)*4px),calc(var(--i)*-3px))}90%{transform:translate(calc(var(--i)*-2px),calc(var(--i)*1px))}}
.ghost{position:fixed;z-index:51;font-size:calc(var(--b)/8*.9);pointer-events:none}
.ghost.w{color:#fff8e6;text-shadow:0 0 18px #f4b942,0 0 3px #f4b942}.ghost.b{color:#14101f;text-shadow:0 0 18px #f4b942,0 0 3px #f4b942,0 0 3px #f4b942}
.pillar{position:fixed;z-index:48;top:0;pointer-events:none;background:linear-gradient(to top,#fff8,#f4b942aa 30%,#f4b94200);transform-origin:bottom;animation:pil 1.3s ease-out forwards;filter:blur(2px)}
@keyframes pil{0%{transform:scaleY(0) scaleX(.2);opacity:1}25%{transform:scaleY(1) scaleX(1);opacity:1}100%{transform:scaleY(1) scaleX(.1);opacity:0}}
.banner{position:fixed;left:0;right:0;top:38%;z-index:52;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:ban .7s cubic-bezier(.2,1.4,.4,1) both;transition:opacity .5s}
.banner.out{opacity:0}
.banner b{font-size:clamp(32px,9vw,76px);font-weight:800;color:#fff;text-shadow:0 0 20px var(--gold),0 0 50px var(--gold),0 4px 0 #8a5a00;letter-spacing:2px}
.banner i{font-style:normal;font-size:clamp(16px,3.5vw,26px);color:#fff;text-shadow:0 2px 8px #000}
.banner.sm b{font-size:clamp(26px,7vw,52px)}
.banner.red b{color:#fff;text-shadow:0 0 20px var(--red),0 0 50px var(--red),0 4px 0 #6a0010}
.banner.mate{top:30%}
.banner.mate b{font-size:clamp(38px,12vw,110px);background:linear-gradient(#fff,#f4b942 60%,#ff4d5e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px #f4b942)}
.banner button{pointer-events:auto;margin-top:12px;background:var(--gold);color:#2a1a00;border:0;font-size:18px;padding:10px 26px}
@keyframes ban{from{transform:scale(3.2);opacity:0;filter:blur(12px)}to{transform:none;opacity:1;filter:none}}

 for(let i=0;i<8;i++)for(let j=0;j<8;j++){const p=b[i][j];if(!p)continue;const w=isW(p),t=p.toLowerCase(),ix=(w?i:7-i)*8+j;

const face=(id,n)=>$(id).innerHTML=Array.from({length:9},(_,i)=>`<i${PIP[n].includes(i)?' class="on"':''}></i>`).join('');
const d6=()=>1+Math.random()*6|0;let rolling=false,winner=0;
function openDice(){rolling=false;$('dice').classList.add('on');face('d1',1);face('d2',1);$('pl1').className=$('pl2').className='pl';
 $('dmsg').textContent='ผู้เล่น 1 เป็นฝ่ายขาว · ผู้เล่น 2 เป็นฝ่ายดำ — ใครทอยได้แต้มมากกว่าจะได้เดินก่อน';$('roll').hidden=false;$('go').hidden=true}
function roll(){if(rolling||!$('dice').classList.contains('on'))return;rolling=true;$('roll').hidden=true;$('go').hidden=true;
 $('pl1').className=$('pl2').className='pl';$('dmsg').textContent='กำลังทอย…';$('d1').classList.add('roll');$('d2').classList.add('roll');
 let n=0;const iv=setInterval(()=>{face('d1',d6());face('d2',d6());tone(rnd(250,600),.04,'square',.04);if(++n>=14){clearInterval(iv);finish()}},90)}
function finish(){const a=d6(),b=d6();face('d1',a);face('d2',b);$('d1').classList.remove('roll');$('d2').classList.remove('roll');rolling=false;
 if(a==b){$('dmsg').textContent=`ทั้งสองคนทอยได้ ${a} เท่ากัน! ทอยใหม่…`;tone(300,.3,'sawtooth',.08);setTimeout(roll,1400)}
 else{winner=a>b?1:2;$('pl'+winner).classList.add('win');$('dmsg').innerHTML=`ผู้เล่น ${winner} ได้แต้มมากกว่า (${a} ต่อ ${b})<br>เล่นฝ่าย${winner==1?'ขาว':'ดำ'} และเดินก่อน`;rolling=true;tone(500,.2,'triangle',.1);setTimeout(()=>showResult(a,b),1000)}}
let resMode='dice';
function celebrate(){const x=innerWidth/2,y=innerHeight*.42;flash('#f4b942',.55);
 [0,150,320,520].forEach((d,i)=>ring(x,y,i%2?'#fff':'#f4b942',innerWidth*(.25+i*.14),d));
 burst(x,y,200,['#fff','#f4b942','#ffe28a','#ff4d5e'],560,220);
 for(let i=0;i<7;i++)T.push(setTimeout(rocket,250+i*150));
 T.push(setInterval(rocket,420));const c=setInterval(confetti,40);T.push(c);T.push(setTimeout(()=>clearInterval(c),9000))}
function showResult(a,b){const w=a>b?1:2;resMode='dice';
 $('rcrown').innerHTML='';$('rsc').innerHTML=`<span class="${a>b?'w':'l'}">${a}</span><span class="c">:</span><span class="${b>a?'w':'l'}">${b}</span>`;
 $('rwho').textContent=`ผู้เล่น ${w} ได้เริ่มก่อน!`;$('rsub').textContent=`ผู้เล่น ${w} เล่นฝ่าย${w==1?'ขาว ♔':'ดำ ♚'} และเดินก่อน`;$('rtap').textContent='กดเพื่อเริ่มเกม';$('rview').hidden=$('rmenu').hidden=true;
 $('res').classList.add('on');sfx.mate();celebrate()}
function showEnd(winW){resMode='end';const side=winW?'ขาว':'ดำ';
 $('rcrown').innerHTML=`<span class="${winW?'w':'b'}">♚\uFE0E</span>`;
 $('rsc').innerHTML='<span class="w" style="font-size:.4em;letter-spacing:.06em">CHECKMATE</span>';
 $('rwho').textContent=net.on?(winW==(net.color=='w')?'คุณชนะ!':'คู่แข่งชนะ!'):wp?`ผู้เล่น ${winW?wp:3-wp} ชนะ!`:vs?(winW?'คุณชนะ!':'คอมพิวเตอร์ชนะ!'):`ฝ่าย${side}ชนะ!`;
 $('rsub').textContent=`ฝ่าย${side} · รุกฆาตสำเร็จ`;$('rtap').textContent='เล่นอีกครั้ง';$('rview').hidden=$('rmenu').hidden=false;
 $('res').classList.add('on');sfx.pro();celebrate();flash('#fff',.5);shake(1.2)}
$('res').onclick=e=>{if(resMode=='end'){if(e.target.closest('#rtap')){if(net.on)return rematch();$('res').classList.remove('on');newGame()}return}
 rolling=false;wp=1;startTurn=winner==1?'w':'b';clearFx();$('res').classList.remove('on');$('dice').classList.remove('on');$('mode').value=0;newGame()};
$('rview').onclick=e=>{e.stopPropagation();$('res').classList.remove('on')};
$('rmenu').onclick=e=>{e.stopPropagation();showMenu()};
$('roll').onclick=roll;
$('go').onclick=()=>{wp=1;startTurn=winner==1?'w':'b';$('dice').classList.remove('on');$('mode').value=0;newGame()};
$('dback').onclick=()=>{if(rolling)return;$('dice').classList.remove('on');$('menu').classList.add('on')};
function showMenu(){netClose();$('online').classList.remove('on');tTok++;$('dice').classList.remove('on');$('res').classList.remove('on');aiTok++;clearFx();busy=false;$('promo').classList.remove('on');$('m1').hidden=false;$('m2').hidden=true;$('menu').classList.add('on')}
$('menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a=='ai'){$('m1').hidden=true;$('m2').hidden=false}else if(a=='back'){$('m1').hidden=false;$('m2').hidden=true}
 else if(a=='online'){openOnline()}
 else if(a=='0'){$('menu').classList.remove('on');openDice()}
 else{wp=0;$('mode').value=a;$('menu').classList.remove('on');newGame()}};
$('home').onclick=showMenu;
$('newg').onclick=()=>{if(net.on)return toast('ออนไลน์: กดเล่นอีกครั้งหลังจบเกม',2500);newGame()};
$('undo').onclick=()=>{if(net.on||busy||!hist.length)return;aiTok++;clearFx();S=JSON.parse(hist.pop());if(vs&&S.turn=='b'&&hist.length)S=JSON.parse(hist.pop());sel=null;render();const tk=++tTok;setTimeout(()=>{if(tk==tTok)turnBanner()},250)};
$('mode').onchange=newGame;
$('snd').onclick=e=>{mute=!mute;e.target.textContent='เสียง: '+(mute?'ปิด':'เปิด')};
(()=>{const L=[],dot=(x,y,k)=>L.push(`radial-gradient(circle calc(var(--s)*${k}) at ${x}% ${y}%,#fff3c4 0,#f0c75e 45%,#a87420 75%,#0000 82%)`);
 [[50,4.6],[50,95.4],[4.6,50],[95.4,50]].forEach(a=>dot(a[0],a[1],.02));
 [27,73].forEach(t=>{dot(t,4.6,.012);dot(t,95.4,.012);dot(4.6,t,.012);dot(95.4,t,.012)});
 $('studs').style.backgroundImage=L.join(',')})();
(()=>{const logo=$('logo'),box=$('pcs');
 [['k',2],['k',1],['r',2],['r',1],['k',0],['r',0]].forEach(([c,g])=>{const d=document.createElement('div');d.className=`pc ${c} ${g?'g'+g:'m'}`;d.innerHTML='<div class="spr"></div>';box.append(d)});
 const hit=()=>{if(RM||!$('menu').classList.contains('on'))return;const r=logo.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.44;
  burst(x,y,90,['#fff','#ffe28a','#f4b942','#ff7a3d','#ff4d5e'],520,240);burst(x,y,30,['#fff','#ffe28a'],760,80);ring(x,y,'#ffe28a',r.width*.55);ring(x,y,'#ff4d5e',r.width*.8,70)};
 let prev=0;setInterval(()=>{const a=logo.getAnimations().find(a=>a.animationName=='lshake');if(!a)return;const t=a.currentTime%2400;if(prev<1008&&t>=1008)hit();prev=t},30);
 const pr=new Image();let n=0;
 pr.onload=()=>{const src=pr.src,l=document.createElement('link');l.rel='icon';l.href=src;document.head.append(l);};
 pr.onerror=()=>{if(n++==0)pr.src='icon.jpg'};pr.src='icon.png'})();
newGame();
</script>
</body>
</html>
